<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nimiq Pulse">
  <defs>
    <linearGradient id="pulseRing" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc43b"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- Level ring: the earned dimension. Gold-to-orange is reserved for progress. -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#pulseRing)" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="139 18" transform="rotate(-96 32 32)"/>

  <!-- Activity trace: the wallet's real on-chain signal. Inherits text colour. -->
  <path d="M12 32h9l4-10 5 21 5-16 4 5h11" fill="none" stroke="currentColor" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
